name: Build

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to build
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Git branch, tag, or commit to build
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-latest
            r: release
          - os: macos-latest
            r: release
          - os: windows-latest
            r: release

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_SYSTEM_CLOCK_: 'false'
      _R_CHECK_CRAN_INCOMING_: 'false'
      _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up R
        uses: r-lib/actions/setup-r@v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2.12.1

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
          needs: check

      - name: Generate package documentation
        shell: Rscript {0}
        run: roxygen2::roxygenise()

      - name: Check package
        uses: r-lib/actions/check-r-package@v2.12.1
        with:
          args: 'c("--no-manual", "--as-cran")'
          check-dir: '"build"'
          error-on: '"note"'
